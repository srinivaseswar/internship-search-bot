# Render Blueprint — Internship Command Center
# Docs: https://render.com/docs/blueprint-spec
#
# Deployment mode: DEMO  (DEMO_MODE=true, no database required)
# To switch to production with a real Postgres DB:
#   1. Uncomment the `databases:` block below
#   2. Change DEMO_MODE value to "false"
#   3. Change DATABASE_URL `value:` to `fromDatabase:` (see comment inline)
#   4. Add `pnpm --filter @workspace/db run push &&` to the buildCommand

services:
  - type: web
    name: internship-command-center
    runtime: node
    plan: free
    region: singapore           # closest to India; change to frankfurt/ohio as needed
    branch: main                # change to your default branch if different

    # ── Build ────────────────────────────────────────────────────────────────
    # 1. Install pnpm globally
    # 2. Install all workspace dependencies
    # 3. Build the Vite frontend (outputs to artifacts/internship-command-center/dist/public)
    # 4. Build the Express API (outputs to artifacts/api-server/dist/index.mjs)
    buildCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/internship-command-center run build &&
      pnpm --filter @workspace/api-server run build

    # ── Start ────────────────────────────────────────────────────────────────
    startCommand: node artifacts/api-server/dist/index.mjs

    # ── Health check ─────────────────────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Environment variables ─────────────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production

      # DEMO_MODE=true → API uses in-memory seed data (no database needed).
      # Set to "false" if you add a real Postgres database below.
      - key: DEMO_MODE
        value: "true"

      # Render injects PORT automatically for web services — do not set it here.

      # DATABASE_URL — only needed when DEMO_MODE=false.
      # Uncomment and switch to fromDatabase when you add the database block:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: internship-db
      #     property: connectionString

# ── PostgreSQL (production mode only) ────────────────────────────────────────
# Uncomment this block when you are ready to use a real database:
#
# databases:
#   - name: internship-db
#     plan: free          # Free tier; expires after 90 days on Render
#     region: singapore
