# Render Blueprint — Internship Command Center
# Docs: https://render.com/docs/blueprint-spec
#
# Deployment mode: PRODUCTION (real PostgreSQL, auth enabled)

services:
  - type: web
    name: internship-command-center
    runtime: node
    plan: free
    region: singapore
    branch: main

    buildCommand: >-
      cd internship-command-center &&
      npm config set prefix $HOME/.npm-global &&
      npm install -g pnpm@10 &&
      export PATH=$HOME/.npm-global/bin:$PATH &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/internship-command-center run build &&
      pnpm --filter @workspace/api-server run build

    startCommand: node internship-command-center/artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/healthz

    envVars:
      - key: NODE_ENV
        value: production

      - key: DEMO_MODE
        value: "false"

      - key: CRON_ENABLED
        value: "true"

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: internship-db
          property: connectionString

databases:
  - name: internship-db
    plan: free
    region: singapore
