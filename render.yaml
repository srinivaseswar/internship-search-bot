# Render Blueprint — Internship Command Center
# Docs: https://render.com/docs/blueprint-spec
#
# Deployment mode: DEMO (DEMO_MODE=true, no database required)

services:
  - type: web
    name: internship-command-center
    runtime: node
    plan: free
    region: singapore
    branch: main

    # ── Build ─────────────────────────────────────────────────────────────────
    # Fix: npm -g writes to /usr/lib which is read-only on Render.
    # Solution: redirect npm global prefix to $HOME/.npm-global (writable),
    # add it to PATH, then install pnpm@10 and run the workspace builds.
    buildCommand: >-
      cd internship-command-center &&
      npm config set prefix $HOME/.npm-global &&
      npm install -g pnpm@10 &&
      export PATH=$HOME/.npm-global/bin:$PATH &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/internship-command-center run build &&
      pnpm --filter @workspace/api-server run build

    # ── Start ─────────────────────────────────────────────────────────────────
    startCommand: node internship-command-center/artifacts/api-server/dist/index.mjs

    # ── Health check ──────────────────────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Environment variables ─────────────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production

      - key: DEMO_MODE
        value: "true"

      # Render automatically injects PORT for web services.

      # DATABASE_URL — only needed when DEMO_MODE=false.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: internship-db
      #     property: connectionString

# ── PostgreSQL (production mode only) ────────────────────────────────────────
# databases:
